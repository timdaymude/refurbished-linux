# GRUB is installed onto the selected disk only. On UEFI, Calamares writes the
# normal entry and also copies the fallback /EFI/BOOT/BOOTX64.EFI, so a USB
# install boots on a machine whose firmware has no entry for it.
efiBootLoader: "grub"
efiBootloaderId: "reawakening"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
