# The installed system must not keep the live boot stack or the installer.
# Removal only: no packages are added and no network is needed. The desktop's
# update path (apt and the update helper) stays untouched.
backend: apt
operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-boot-initramfs-tools
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - calamares
