# Reawakening OS partition configuration.
#
# The user must pick a disk and "Erase disk" explicitly: initialPartitioningChoice
# is deliberately "none". Manual partitioning, LVM and encryption are hidden so
# the beginner path has one understandable choice and no way to create an
# unbootable layout. The filesystem is ext4 (the live system and zram swap need
# no swap partition).

efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "REAWAKENING"

userSwapChoices:
    - none

initialPartitioningChoice: none
initialSwapChoice: none
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false
lvm:
    enable: false

defaultFileSystemType: ext4
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# The live medium is excluded by Calamares when it is iso9660; refurb-installer
# marks it (and the eMMC boot areas) read-only before this module runs. Do not
# hide warning information.
