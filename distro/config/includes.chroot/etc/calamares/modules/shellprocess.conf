# Runs our tested post-install cleanup inside the new root, after the
# bootloader is in place: update-initramfs, remove the live passwordless sudo
# and installer, carry the live desktop/Wi-Fi choices, enable Cockpit, repair
# ownership. The script is part of the image at /usr/lib/refurb/calamares-finalize.
---
dontChroot: false
timeout: 900
verbose: false
script:
    - command: "/usr/lib/refurb/calamares-finalize"
      timeout: 900
