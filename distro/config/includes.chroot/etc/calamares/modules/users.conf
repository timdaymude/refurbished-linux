# Reawakening OS account page.
#
# The created account is the administrator through sudo. Root shares the
# account password by default; clearing the reuse checkbox lets the user give
# root a separate password instead of reusing it.

userGroup: users
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - sudo
    - audio
    - video
    - input
    - render
    - netdev
    - plugdev
    - bluetooth
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: true
doReusePassword: true

passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
    # No libpwquality rule: its dictionary check needs cracklib-runtime, and
    # without it Calamares rejects every password with "error loading
    # dictionary". A plain eight-character minimum is the check here.
