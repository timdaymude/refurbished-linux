# Welcome page requirements. Six GiB is enough for the 1.2 GiB squashfs plus
# updates and user files, and low enough for small eMMC machines. The URLs are
# off: this image has no support portal of its own.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
    requiredStorage: 6
    requiredRam: 1.0
    # The running live system's root is an overlay, so Calamares' "root"
    # check fails on every live boot. Storage and RAM are the useful gates;
    # the partition page still refuses a disk that has no room.
    check:
        - storage
        - ram
    required:
        - storage
        - ram
