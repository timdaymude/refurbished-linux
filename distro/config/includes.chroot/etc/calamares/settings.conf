# Reawakening OS installer configuration.
#
# This is Calamares, not a custom installer: the partition page, account
# creation, filesystem creation and GRUB installation are its modules. The
# filesystem that is copied to the target is the live squashfs, as in the
# tested r13 installer. The live medium and the eMMC boot areas are made
# read-only by refurb-installer before Calamares starts.

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

- exec:
  # No custom job runs before partition: Calamares does not put the selected
  # disk into global storage until the partition module builds its jobs, so a
  # pre-partition job cannot know the target. The live medium and eMMC boot
  # areas are made read-only by refurb-installer before this process starts.
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - packages
  - bootloader
  # update-initramfs, copy the live desktop settings, remove live-only files
  # and enable Cockpit, all inside the new system before it is unmounted.
  - shellprocess@refurb-finalize
  - removeuser
  - umount

- show:
  - finished

branding: reawakening

# Show the "are you sure" prompt at the point of no return. Combined with the
# explicit erase choice in the partition module, no destructive job starts
# without a second confirmation.
prompt-install: true

dont-chroot: false
