# Reawakening OS: power key and lid switch.
#
# A short press of the power key must never lose open work. logind is therefore
# left with its default action, and the *desktop session* takes a low-level
# inhibitor lock on the power key (see /usr/lib/refurb/session-inhibit, started
# from labwc's autostart). While that lock is held, logind takes no action at all
# and the key reaches the compositor, which binds XF86PowerOff to the shell's
# confirmation dialog.
#
# This ordering is deliberate: if the desktop is not running - a recovery
# console, a crashed session - the lock is gone and logind's default action is
# back, so the machine can still be switched off normally.
#
# The long press stays with logind. A low-level lock suppresses that too, but
# every laptop's embedded controller also powers the machine off when the key is
# held for several seconds, and that path needs no software at all.
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
IdleAction=ignore
