[Service]
# An empty assignment resets the packaged ExecStart before the replacement is
# read; without it systemd refuses the drop-in.
ExecStart=
ExecStart=-/usr/lib/refurb/tty1-autologin %I $TERM
# tty1 belongs to the desktop session. tty2-tty6 stay ordinary recovery
# consoles with a normal login prompt (see the build hook).
Type=idle
