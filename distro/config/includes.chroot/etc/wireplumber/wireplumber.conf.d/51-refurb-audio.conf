# Built-in audio: real amplification, and no idle suspend.
#
# Two independent problems were reported on the Acer Chromebook.
#
# 1. 150-160% on the bar did not get louder. With PipeWire's default hardware
#    mixer, the sink volume cannot go above the codec's maximum: the percentage
#    changes, the speaker level does not. api.alsa.soft-mixer = true makes
#    WirePlumber leave the hardware mixer at 0 dB and apply the whole range in
#    software, so 100-160% is real gain. It also gives every machine the same
#    volume curve instead of a codec-specific one.
#
# 2. Jellyfin's first seconds were silent. WirePlumber suspends an output that
#    has been idle, and both Jellyfin Media Player and Chromium open the audio
#    stream only when playback starts. The first seconds were the ALSA device
#    resuming. These rules keep the built-in output awake while leaving HDMI
#    and Bluetooth alone, so they still power down when unused.
#
# One rule per match: SPA-JSON accepts several match objects in one array, but
# separate rules are unambiguous and each failure is independent.
#
# The node names cover both naming schemes seen on these machines: the HDA
# "analog-stereo" sink and the SOF/UCM "HiFi__Speaker__sink" used by many
# Chromebooks, which the analog-only match in r12 missed.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        # Software volume and mute for every ALSA card. The sink volume the
        # user sets is then the real output level, above 100% included.
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*analog.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
]

node.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*analog.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
]
