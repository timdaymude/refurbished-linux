# Keep the built-in analog output awake.
#
# The Jellyfin audio delay was the sound card, not the player: WirePlumber
# suspends an output that has been idle, and Chromium (Brave) opens its audio
# stream only when playback starts. The first seconds of playback were therefore
# spent resuming the ALSA device, which is exactly the "picture first, sound a
# few seconds later" report. Vosk dictation has the same problem on the input
# side, which is why the microphone is opened before the model finishes loading.
#
# This rule tells WirePlumber not to suspend the analog sink when nothing is
# playing. Only the analog output is covered; HDMI and USB outputs keep the
# default behaviour so they still power down when they are not in use.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*analog.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
]

node.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*analog.*" }
    ]
    actions = {
      update-props = {
        node.suspend-on-idle = false
      }
    }
  }
]
