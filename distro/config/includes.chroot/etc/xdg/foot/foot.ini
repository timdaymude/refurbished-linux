# The terminal, matched to the Reawakening OS dark palette.
[main]
# A terminal needs a monospaced face: Inter is proportional, and columns in
# 
# command output (wpctl, journalctl, ls -l) do not line up with it.
font=DejaVu Sans Mono:size=10
pad=10x10
dpi-aware=no

[colors]
background=14161b
foreground=eceef2
regular0=2e343f
regular1=e8835c
regular2=35c2a3
regular3=d9b36a
regular4=6ea8e8
regular5=c79ae0
regular6=6fd0c6
regular7=a7aebb
bright0=3a414e
bright1=f09a77
bright2=8fe9d2
bright3=efd08c
bright4=93c1f5
bright5=dab4ef
bright6=9fe6de
bright7=f4f6fa
