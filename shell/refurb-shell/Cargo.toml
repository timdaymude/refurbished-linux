[package]
name = "refurb-shell"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Reawakening OS desktop shell: bar, launcher, quick settings and system windows"
license = "GPL-3.0-or-later"

[dependencies]
# Rendering: pure Rust, CPU rasterisation (no GPU, no C toolchain needed).
tiny-skia = "0.11"
fontdue = "0.9"

# Wallpapers: the built-in pictures and any picture the user brings (PNG,
# JPEG, WebP) are decoded in the shell. Pure Rust, so no image tools are needed
# on the build host or in the image, and no thumbnail service runs at login.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Session (Wayland) support. Optional so the UI can be built, tested and
# rendered headlessly on machines without Wayland libraries.
wayland-client = { version = "0.31", optional = true }
# `unstable` carries cursor-shape-v1, which is how the shell asks for a
# pointer shape instead of drawing one.
wayland-protocols = { version = "0.31", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
libloading = { version = "0.8", optional = true }

# The launcher rescans when a desktop entry appears or disappears. inotify is
# the kernel event source: no polling timer, one sleeping thread.
inotify = "0.11"

[features]
default = ["session"]
session = [
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
    "dep:libloading",
]

[[bin]]
name = "refurb-shell"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Deliberately unwind, not abort. The shell owns the bar and every window, so
# one panic in a drawing or hardware path used to kill the whole desktop. With
# unwinding, `catch_unwind` in the session can report the failure and keep the
# session alive, which is what "a control must not crash the desktop" needs.
panic = "unwind"
strip = true
